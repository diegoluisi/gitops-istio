multitenancy_enabled: false
ingest_storage:
  enabled: false
usage_stats:
  enabled: false
server:
  http_listen_port: 9009
blocks_storage:
  backend: filesystem
  bucket_store:
    sync_dir: /data/tsdb-sync
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb
compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist
distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1
ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules
store_gateway:
  sharding_ring:
    replication_factor: 1
limits:
  max_label_names_per_series: 64
  compactor_blocks_retention_period: 7d
