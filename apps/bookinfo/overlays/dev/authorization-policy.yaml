apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: egress-httpbin-only
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: egress-waypoint
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: ["httpbin.org", "httpbin.org:80"]
            ports: ["80"]
