apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bookinfo-egress
spec:
  hosts: 
    - httpbin.org
    - wikipedia.org
  exportTo: [".", istio-gateways]
  gateways: [mesh, istio-gateways/egressgateway]
  http:
    - match:
        - gateways: [mesh]
          port: 80
      route:
        - destination:
            host: istio-egressgateway.istio-gateways.svc.cluster.local
            port:
              number: 80
            subset: httpbin
          weight: 100
    - match:
        - gateways: [istio-gateways/egressgateway]
          port: 80
      route:
        - destination:
            host: httpbin.org
            port:
              number: 80
            subset: httpbin
          weight: 100              
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: httpbin-egress-gateway
spec:
  host: istio-egressgateway.istio-gateways.svc.cluster.local
  exportTo: ["."]
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 80
        tls:
          mode: ISTIO_MUTUAL
          sni: httpbin.org
