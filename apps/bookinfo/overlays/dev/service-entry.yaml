apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: bookinfo
spec:
  exportTo:
    - "."
    - istio-gateways
  hosts:
    - httpbin.org
    - www.wikipedia.org
  ports:
    - number: 80
      name: http
      protocol: HTTP
    - number: 443
      name: https
      protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS
