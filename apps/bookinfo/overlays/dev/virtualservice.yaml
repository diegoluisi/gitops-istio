apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bookinfo-ingress
spec:
  hosts:
    - "*"
  gateways:
    - istio-gateways/shared-ingress
  http:
    - name: details-default
      match:
        - uri:
            exact: /details
      rewrite:
        uri: /details/0
      route:
        - destination:
            host: details.bookinfo.svc.cluster.local
            port:
              number: 9080
    - name: details
      match:
        - uri:
            prefix: /details/
      route:
        - destination:
            host: details.bookinfo.svc.cluster.local
            port:
              number: 9080
    - name: productpage
      match:
        - uri:
            exact: /productpage
        - uri:
            prefix: /productpage/
        - uri:
            prefix: /static/
        - uri:
            exact: /login
        - uri:
            exact: /logout
        - uri:
            prefix: /api/v1/products
      route:
        - destination:
            host: productpage.bookinfo.svc.cluster.local
            port:
              number: 9080
