apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster addons for the Istio ICA lab
  sourceRepos:
    - https://blob.istio.io/istio-release/charts
    - https://github.com/diegoluisi/gitops-istio.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: istio-gateways
    - server: https://kubernetes.default.svc
      namespace: default
    - server: https://kubernetes.default.svc
      namespace: kiali-system
    - server: https://kubernetes.default.svc
      namespace: tempo
    - server: https://kubernetes.default.svc
      namespace: grafana
    - server: https://kubernetes.default.svc
      namespace: alloy
    - server: https://kubernetes.default.svc
      namespace: mimir
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ops
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/diegoluisi/gitops-istio.git
        revision: HEAD
        requeueAfterSeconds: 20
        directories:
          - path: addons/*/*/overlays/ops
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ index .path.segments 2 }}-{{ .path.basename }}'
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: addons
        cluster: '{{ .path.basename }}'
    spec:
      project: addons
      source:
        repoURL: https://github.com/diegoluisi/gitops-istio.git
        targetRevision: HEAD
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}'
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.failurePolicy
            - .webhooks[]?.clientConfig.caBundle
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
