apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
resources:
  - ../../base
  - virtualservice.yaml
configMapGenerator:
  - name: istio-ambient-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - istio-ambient.json=dashboards/istio-ambient.json
