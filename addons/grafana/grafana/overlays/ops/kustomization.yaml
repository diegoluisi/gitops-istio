apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
resources:
  - ../../base
  - virtualservice.yaml
configMapGenerator:
  - name: grafana-istio-dashboards
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "/tmp/dashboards/Istio"
    files:
      - istio-ambient.json=dashboards/istio/istio-ambient.json
      - istio-control-plane.json=dashboards/istio/istio-control-plane.json
      - istio-egress.json=dashboards/istio/istio-egress.json
      - istio-logs.json=dashboards/istio/istio-logs.json
      - istio-loki-14876.json=dashboards/istio/istio-loki-14876.json
      - istio-services.json=dashboards/istio/istio-services.json
      - istio-traces.json=dashboards/istio/istio-traces.json
      - istio-workloads.json=dashboards/istio/istio-workloads.json
  - name: grafana-kubernetes-dashboards
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "/tmp/dashboards/Kubernetes"
    files:
      - kubernetes-health.json=dashboards/kubernetes/kubernetes-health.json
  - name: grafana-argocd-dashboards
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "/tmp/dashboards/Argo CD"
    files:
      - default.json=dashboards/argocd/default.json
  - name: grafana-kyverno-dashboards
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "/tmp/dashboards/Kyverno"
    files:
      - default-15987.json=dashboards/kyverno/default-15987.json
      - kyverno.json=dashboards/kyverno/kyverno.json
  - name: grafana-mimir-dashboards
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "/tmp/dashboards/Mimir"
    files:
      - default-overview.json=dashboards/mimir/default-overview.json
  - name: grafana-loki-dashboards
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "/tmp/dashboards/Loki"
    files:
      - default-operational.json=dashboards/loki/default-operational.json
  - name: grafana-alloy-dashboards
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "/tmp/dashboards/Alloy"
    files:
      - default-controller.json=dashboards/alloy/default-controller.json
      - default-opentelemetry.json=dashboards/alloy/default-opentelemetry.json
      - default-prometheus-remote-write.json=dashboards/alloy/default-prometheus-remote-write.json
      - default-resources.json=dashboards/alloy/default-resources.json
