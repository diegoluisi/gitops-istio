apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
resources:
  - ../../base
  - virtualservice.yaml
configMapGenerator:
  - name: istio-ambient-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - istio-ambient.json=dashboards/istio-ambient.json
      - istio-traces.json=dashboards/istio-traces.json
      - istio-egress.json=dashboards/istio-egress.json
      - istio-control-plane.json=dashboards/istio-control-plane.json
      - kubernetes-health.json=dashboards/kubernetes-health.json
      - istio-logs.json=dashboards/istio-logs.json
      - istio-services.json=dashboards/istio-services.json
      - istio-workloads.json=dashboards/istio-workloads.json
      - istio-loki-14876.json=dashboards/istio-loki-14876.json
