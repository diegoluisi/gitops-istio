fullnameOverride: grafana
persistence:
  enabled: true
  size: 2Gi
# No initial admin account is created; this lab uses anonymous Editor access for Explore.
env:
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
  GF_SECURITY_ADMIN_PASSWORD: unused-initial-admin-disabled
  GF_AUTH_DISABLE_LOGIN_FORM: "true"
grafana.ini:
  server:
    root_url: http://localhost:8080/grafana/
    serve_from_sub_path: true
  auth.anonymous:
    enabled: true
    org_role: Editor
  analytics:
    reporting_enabled: false
    check_for_updates: false
datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.tempo.svc.cluster.local:3200
        isDefault: true
        editable: false
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir.mimir.svc.cluster.local:9009/prometheus
        editable: false
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    searchNamespace: grafana
    folder: /tmp/dashboards
    provider:
      name: gitops
      folder: Istio
      disableDelete: false
      allowUiUpdates: false
