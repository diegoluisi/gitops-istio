apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-system-metrics-proxy
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-system-metrics-proxy
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-system-metrics-proxy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: alloy
