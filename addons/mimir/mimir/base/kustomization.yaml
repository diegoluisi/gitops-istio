apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
configMapGenerator:
  - name: mimir-config
    files:
      - mimir.yaml
  - name: mimir-recording-rules
    files:
      - istio.yaml=rules/istio.yaml
      - service-dashboards.yaml=rules/service-dashboards.yaml
      - bookinfo.yaml=rules/bookinfo.yaml
