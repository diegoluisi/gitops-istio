apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
spec:
  serviceName: mimir
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mimir
          image: grafana/mimir:3.2.1
          workingDir: /data
          args:
            - -target=all
            - -config.file=/etc/mimir/mimir.yaml
          ports:
            - name: http-metrics
              containerPort: 9009
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 60
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
            - name: recording-rules
              mountPath: /etc/mimir-rules/anonymous
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: recording-rules
          configMap:
            name: mimir-recording-rules
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        volumeMode: Filesystem
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
