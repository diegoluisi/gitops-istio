apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: egressgateway
spec:
  selector:
    istio: egressgateway
  servers:
    - port:
        number: 80
        name: tls-httpbin
        protocol: HTTPS
      hosts:
        - *
      tls:
        mode: ISTIO_MUTUAL
