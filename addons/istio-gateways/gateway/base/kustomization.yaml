apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: gateway
    repo: https://blob.istio.io/istio-release/charts
    version: 1.30.3
    releaseName: istio-ingressgateway
    namespace: istio-gateways
    valuesFile: ingress/values.yaml
  - name: gateway
    repo: https://blob.istio.io/istio-release/charts
    version: 1.30.3
    releaseName: istio-egressgateway
    namespace: istio-gateways
    valuesFile: egress/values.yaml
resources:
  - shared-gateway.yaml
  - egress-httpbin.yaml
