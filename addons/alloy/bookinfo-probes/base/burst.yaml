apiVersion: batch/v1
kind: CronJob
metadata:
  name: bookinfo-load-burst
spec:
  # Opt-in: create a one-off Job from this CronJob for incident exercises.
  suspend: true
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      activeDeadlineSeconds: 120
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: bookinfo-load-burst
            sidecar.istio.io/inject: "true"
          annotations:
            sidecar.istio.io/nativeSidecar: "true"
            proxy.istio.io/config: |
              proxyStatsMatcher:
                inclusionRegexps:
                  - ".*details.*(upstream_rq_active|upstream_rq_pending_active|upstream_rq_pending_overflow|upstream_cx_active|upstream_cx_overflow|outlier_detection.*).*"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: load
              image: python:3.13.9-slim
              command: [python, -u, /app/probes.py, --burst]
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 96Mi
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: bookinfo-probes
