apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enable-istio-injection
  annotations:
    policies.kyverno.io/title: Enable Istio sidecar injection
    policies.kyverno.io/subject: Namespace
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Audit
  background: true
  rules:
    - name: label-new-and-updated-namespaces
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [Namespace]
              operations: [CREATE, UPDATE]
      exclude:
        any:
          - resources:
              kinds: [Namespace]
              names: [kube-system, kube-public, kube-node-lease, istio-system, istio-gateways, kyverno, argocd, local-path-storage]
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              istio-injection: enabled
    - name: label-existing-namespaces
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [Namespace]
              operations: [CREATE, UPDATE]
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: v1
            kind: Namespace
            name: "*"
            preconditions:
              all:
                - key: "{{ target.metadata.name }}"
                  operator: AnyNotIn
                  value: [kube-system, kube-public, kube-node-lease, istio-system, istio-gateways, kyverno, argocd, local-path-storage]
        patchStrategicMerge:
          metadata:
            labels:
              istio-injection: enabled
