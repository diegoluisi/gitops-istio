apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: istio-injection
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    policies.kyverno.io/title: Enable Istio sidecar injection
spec:
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
    mutateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: exclude-infrastructure
      expression: "!(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'istio-system', 'istio-gateways', 'kyverno', 'argocd', 'local-path-storage'])"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'istio-system', 'istio-gateways', 'kyverno', 'argocd', 'local-path-storage']
          ? Object{}
          : Object{
            metadata: Object.metadata{
              labels: {"istio-injection": "enabled"}
            }
          }
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: istio-injection-existing
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: false
    background:
      enabled: true
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  targetMatchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [namespaces]
    objectSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, istio-system, istio-gateways, kyverno, argocd, local-path-storage]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              labels: {"istio-injection": "enabled"}
            }
          }
