apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno/
    version: 3.9.2
    releaseName: kyverno
    namespace: kyverno
    includeCRDs: true
    valuesFile: values.yaml
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: '.*\.policies\.kyverno\.io'
    patch: |-
      - op: add
        path: /spec/conversion
        value:
          strategy: None
