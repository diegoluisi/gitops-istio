apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
spec:
  istio_namespace: istio-system
  auth:
    strategy: anonymous
  deployment:
    view_only_mode: true
  external_services:
    prometheus:
      url: http://prometheus.istio-system.svc.cluster.local:9090
    grafana:
      enabled: false
    tracing:
      enabled: true
      provider: tempo
      use_grpc: false
      internal_url: http://tempo.tempo.svc.cluster.local:3200
      tempo_config:
        datasource_uid: tempo
