---
apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
spec:
  istio_namespace: istio-system
  auth:
    strategy: anonymous
  deployment:
    view_only_mode: true
  external_services:
    prometheus:
      url: http://mimir.mimir.svc.cluster.local:9009/prometheus
      health_check_url: http://mimir.mimir.svc.cluster.local:9009/ready
      thanos_proxy:
        enabled: true
        scrape_interval: 15s
        retention_period: 7d
    grafana:
      enabled: true
      internal_url: http://grafana.grafana.svc.cluster.local/grafana/
      external_url: http://localhost:8080/grafana/
      dashboards:
      - name: Istio Sidecar Metrics
        variables:
          namespace: var-namespace
      - name: Istio Control Plane and Gateways
      - name: Kubernetes Workload Health
      - name: Istio Logs
    tracing:
      enabled: true
      provider: tempo
      use_grpc: false
      internal_url: http://tempo.tempo.svc.cluster.local:3200
      tempo_config:
        datasource_uid: tempo
      external_url: http://localhost:8080/grafana/
