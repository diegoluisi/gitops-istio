apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: istiod
    repo: https://blob.istio.io/istio-release/charts
    version: 1.30.3
    releaseName: istiod
    namespace: istio-system
    includeCRDs: true
    valuesFile: values.yaml
resources:
  - peer-authentication.yaml
  - telemetry.yaml
