apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: awx-ingress
spec:
  hosts:
    - "*"
  gateways:
    - istio-gateways/shared-ingress
  http:
    - name: awx
      match:
        - uri:
            exact: /awx
        - uri:
            prefix: /awx/    
      route:
        - destination:
            host: awx-service.awx.svc.cluster.local
            port:
              number: 80